version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pivoo
      POSTGRES_PASSWORD: pivoo_dev
      POSTGRES_DB: pivoo
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pivoo']
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./services/auth-service
      target: development
    environment:
      - DATABASE_URL=postgresql://pivoo:pivoo_dev@postgres:5432/pivoo?schema=auth
      - JWT_SECRET=local_jwt_secret_change_in_prod
      - JWT_REFRESH_SECRET=local_jwt_refresh_secret_change_in_prod
      - JWT_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - PORT=3001
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/auth-service:/app
      - /app/node_modules

  users-service:
    build:
      context: ./services/users-service
      target: development
    environment:
      - DATABASE_URL=postgresql://pivoo:pivoo_dev@postgres:5432/pivoo?schema=users
      - JWT_SECRET=local_jwt_secret_change_in_prod
      - AUTH_SERVICE_URL=http://auth-service:3001
      - PORT=3002
    ports:
      - '3002:3002'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/users-service:/app
      - /app/node_modules

  matches-service:
    build:
      context: ./services/matches-service
      target: development
    environment:
      - DATABASE_URL=postgresql://pivoo:pivoo_dev@postgres:5432/pivoo?schema=matches
      - JWT_SECRET=local_jwt_secret_change_in_prod
      - AUTH_SERVICE_URL=http://auth-service:3001
      - USERS_SERVICE_URL=http://users-service:3002
      - SPORTS_SERVICE_URL=http://sports-service:3004
      - COMPLEXES_SERVICE_URL=http://complexes-service:3005
      - KAFKA_BROKERS=kafka:9092
      - PORT=3003
    ports:
      - '3003:3003'
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./services/matches-service:/app
      - /app/node_modules

  sports-service:
    build:
      context: ./services/sports-service
      target: development
    environment:
      - DATABASE_URL=postgresql://pivoo:pivoo_dev@postgres:5432/pivoo?schema=sports
      - JWT_SECRET=local_jwt_secret_change_in_prod
      - AUTH_SERVICE_URL=http://auth-service:3001
      - PORT=3004
    ports:
      - '3004:3004'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/sports-service:/app
      - /app/node_modules

  complexes-service:
    build:
      context: ./services/complexes-service
      target: development
    environment:
      - DATABASE_URL=postgresql://pivoo:pivoo_dev@postgres:5432/pivoo?schema=complexes
      - JWT_SECRET=local_jwt_secret_change_in_prod
      - AUTH_SERVICE_URL=http://auth-service:3001
      - PORT=3005
    ports:
      - '3005:3005'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/complexes-service:/app
      - /app/node_modules

  kafka:
    image: bitnami/kafka:3.7
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    ports:
      - '9092:9092'
    healthcheck:
      test: ['CMD-SHELL', '/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list']
      interval: 10s
      timeout: 10s
      retries: 10

  notifications-service:
    build:
      context: ./services/notifications-service
      target: development
    environment:
      - DATABASE_URL=postgresql://pivoo:pivoo_dev@postgres:5432/pivoo?schema=notifications
      - JWT_SECRET=local_jwt_secret_change_in_prod
      - KAFKA_BROKERS=kafka:9092
      - PORT=3007
    ports:
      - '3007:3007'
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    volumes:
      - ./services/notifications-service:/app
      - /app/node_modules

  teams-service:
    build:
      context: ./services/teams-service
      target: development
    environment:
      - DATABASE_URL=postgresql://pivoo:pivoo_dev@postgres:5432/pivoo?schema=teams
      - JWT_SECRET=local_jwt_secret_change_in_prod
      - MATCHES_SERVICE_URL=http://matches-service:3003
      - PORT=3006
    ports:
      - '3006:3006'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./services/teams-service:/app
      - /app/node_modules

volumes:
  postgres_data:
